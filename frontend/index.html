<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoMove CM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">CargoMove</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto" id="navLinks">
                    </ul>
            </div>
        </div>
    </nav>

    <main class="container" id="app">
        <div id="authView">
    <ul class="nav nav-tabs mb-4" id="authTabs">
        <li class="nav-item"><a class="nav-link active" href="#" data-tab="login">Log in</a></li>
        <li class="nav-item"><a class="nav-link" href="#" data-tab="register">Register</a></li>
    </ul>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="loginUsername" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <div class="alert alert-danger d-none" id="loginError"></div>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <form id="registerForm" class="d-none">
        <div class="mb-3">
            <label class="form-label">I am a</label>
            <select class="form-select" id="registerRole">
                <option value="customer">Sender</option>
                <option value="driver">Driver</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="registerUsername" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="registerEmail" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="registerPassword" required>
        </div>

        <div class="mb-3" id="companyNameField">
            <label class="form-label">Company name (optional)</label>
            <input type="text" class="form-control" id="registerCompanyName">
        </div>
        <div class="mb-3 d-none" id="licenseNumberField">
            <label class="form-label">License number</label>
            <input type="text" class="form-control" id="registerLicenseNumber">
        </div>

        <div class="alert alert-danger d-none" id="registerError"></div>
        <div class="alert alert-success d-none" id="registerSuccess"></div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/app.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
