<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Shipment — CargoMove CM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="senderDashboard.html">CargoMove</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto" id="navLinks"></ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <h4 class="mb-3">New Shipment</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">
            Click the map once for your <strong>pickup</strong> point, and a second time for the <strong>drop-off</strong> point.
        </p>

        <div id="map" style="height: 320px; border-radius: 8px; margin-bottom: 1.5rem;"></div>

        <form id="shipmentForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Origin city</label>
                    <input type="text" class="form-control" id="originCity" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Destination city</label>
                    <input type="text" class="form-control" id="destinationCity" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Pickup date</label>
                    <input type="date" class="form-control" id="pickupDate" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Delivery type</label>
                    <select class="form-select" id="deliveryType">
                        <option value="ECONOMY">Economy</option>
                        <option value="EXPRESS">Express</option>
                        <option value="SCHEDULED">Scheduled</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sharedLoad">
                    <label class="form-check-label">Shared load (15% cheaper)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="loadingAssistance">
                    <label class="form-check-label">Loading assistance</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="specialHandling">
                    <label class="form-check-label">Special handling (fragile)</label>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0">Cargo items</h6>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="addItemBtn">+ Add item</button>
            </div>
            <div id="itemsList"></div>

            <div class="alert alert-danger d-none mt-3" id="shipmentError"></div>
            <div class="mb-3">
    <button type="button" class="btn btn-outline-secondary btn-sm" id="previewPriceBtn">Preview price</button>
    <span class="ms-2 fw-medium" id="pricePreview"></span>
</div>
            <button type="submit" class="btn btn-primary mt-3">Create shipment</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/createShipment.js"></script>
</body>
</html>
