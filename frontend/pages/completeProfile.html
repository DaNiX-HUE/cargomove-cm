<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Identity — CargoMove CM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand">CargoMove</span>
            <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        </div>
    </nav>

    <main class="container">
        <h4 class="mb-2">Verify your identity</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">
            Required once, before you can use CargoMove. This helps keep everyone on the platform safe.
        </p>

        <form id="profileForm">
            <div class="mb-3">
                <label class="form-label">A selfie of you</label>
                <input type="file" class="form-control" id="selfieInput" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label class="form-label">A photo of your ID card</label>
                <input type="file" class="form-control" id="idCardInput" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label class="form-label">A selfie of you holding your ID card</label>
                <input type="file" class="form-control" id="selfieWithIdInput" accept="image/*" required>
            </div>

            <div class="alert alert-danger d-none" id="profileError"></div>
            <button type="submit" class="btn btn-primary">Submit for verification</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/completeProfile.js"></script>
</body>
</html>
