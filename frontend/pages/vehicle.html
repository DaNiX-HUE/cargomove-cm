<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Vehicle - CargoMove CM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" >
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                CargoMove CM
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto" id="navLinks">
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="fw-bold mb-2">
                            Register Your Vehicle
                        </h2>
                        <p class="text-muted mb-4">
                            Add your vehicle information to start receiving shipment offers.
                        </p>
                        <form id="vehicleForm">

                            <div class="mb-3">
                                <label for="plateNumber" class="form-label">
                                    Plate Number
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="plateNumber"
                                    placeholder="Example: LT 123 AA"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="vehicleType" class="form-label">
                                    Vehicle Type
                                </label>

                                <select
                                    class="form-select"
                                    id="vehicleType"
                                    required
                                >
                                    <option value="">Select vehicle type</option>
                                    <option value="Pickup">Pickup</option>
                                    <option value="Canter">Canter</option>
                                    <option value="10-Wheel Truck">10-Wheel Truck</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="maxWeightCapacity" class="form-label">
                                    Maximum Weight Capacity (kg)
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="maxWeightCapacity"
                                    placeholder="Example: 1500"
                                    min="1"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="maxVolumeCapacity" class="form-label">
                                    Maximum Volume Capacity (m³)
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="maxVolumeCapacity"
                                    placeholder="Example: 12"
                                    min="0.1"
                                    step="0.1"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="configuration" class="form-label">
                                    Vehicle Configuration
                                </label>

                                <select
                                    class="form-select"
                                    id="configuration"
                                    required
                                >
                                    <option value="">Select configuration</option>
                                    <option value="Covered">Covered</option>
                                    <option value="Open">Open</option>
                                    <option value="Refrigerated">Refrigerated</option>
                                    <option value="Flatbed">Flatbed</option>
                                    <option value="Side Rails">Side Rails</option>
                                    <option value="Loading Equipment">Loading Equipment</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="status" class="form-label">
                                    Vehicle Status
                                </label>

                                <select
                                    class="form-select"
                                    id="status"
                                    required
                                >
                                    <option value="Available">Available</option>
                                    <option value="Unavailable">Unavailable</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">

                                <a
                                    href="senderDashboard.html"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Register Vehicle
                                </button>

                            </div>

                        </form>

                        <div id="vehicleMessage" class="mt-3"></div>

                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="../js/config.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/vehicle.js"></script>

</body>
</html>
