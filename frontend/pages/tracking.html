<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoMove CM - Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                CargoMove CM
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                id="navMenu">
                <ul class="navbar-nav ms-auto" id="navLinks"> </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-4">

                    <h1 class="fw-bold">
                        Track Your Shipment
                    </h1>
                    <p class="text-muted">
                        Check the current status of your shipment.
                    </p>
                </div>
    
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form id="trackingForm">
                            <div class="mb-3">

                                <label
                                    for="shipmentId"
                                    class="form-label">
                                    Shipment ID
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="shipmentId"
                                    placeholder="Enter shipment ID"
                                    required>
                            </div>
                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Track Shipment
                            </button>
                        </form>

                        <div id="trackingMessage"
                            class="mt-3">
                    </div>
                    </div>
                </div>

                <div
                    id="trackingResult"
                    class="card shadow-sm mt-4 d-none">

                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">
                            Shipment Information
                        </h4>
                        <div class="mb-3">
                            <strong>
                                Shipment ID:
                            </strong>
                            <span id="displayShipmentId"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Status:
                            </strong>
                            <span id="shipmentStatus"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Pickup Location:
                            </strong>
                            <span id="pickupLocation"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Destination:
                            </strong>
                            <span id="destination"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Pickup Date
                            </strong>
                            <span id="pickupDate"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Delivery Type
                            </strong>
                            <span id="deliveryType"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Total Weight:
                            </strong>
                            <span id="totalWeight"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Total Volume:
                            </strong>
                            <span id="totalVolume"> </span>
                        </div>

                        <div class="mb-3">
                            <strong>
                                Estimated Price:
                            </strong>
                            <span id="estimatedPrice"> </span>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/config.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/liveTracking.js"></script>

</body>
</html>
