<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoMove CM - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand"
                href="#">
                CargoMove CM
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navMenu">
                <ul
                    class="navbar-nav ms-auto"
                    id="navLinks">
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="mb-4">
            <h1 class="fw-bold"> Admin Dashboard</h1>
            <p class="text-muted">
                Monitor CargoMove CM activity and shipments. </p>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted"> Customers </h6>
                        <h2 class="fw-bold" id="customerCount">
                            0
                        </h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted"> Drivers</h6>
                        <h2
                            class="fw-bold"
                            id="driverCount">
                            0
                        </h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Vehicles
                        </h6>
                        <h2
                            class="fw-bold"
                            id="vehicleCount" >
                            0
                        </h2>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Shipments
                        </h6>
                        <h2 class="fw-bold" id="shipmentCount">
                            0
                        </h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="fw-bold mb-4">
                    Shipment Overview
                </h4>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>

                                <th>ID</th>
                                <th>Route</th>
                                <th>Pickup Date</th>
                                <th>Status</th>
                                <th>Delivery Type</th>
                                <th>Price</th>

                            </tr>
                        </thead>
                        <tbody id="shipmentTableBody">
                        </tbody>
                    </table>
                </div>

                <div
                    id="adminMessage"
                    class="mt-3"> 
                </div>
            </div>
        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/config.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/adminDashboard.js"></script>

</body>
</html>
