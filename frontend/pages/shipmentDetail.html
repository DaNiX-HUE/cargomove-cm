<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipment Details — CargoMove CM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="senderDashboard.html">CargoMove</a>
            <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        </div>
    </nav>

    <main class="container">
        <div id="shipmentDetail">
            <p class="text-muted">Loading...</p>
        </div>

        <div id="offersSection" class="mt-4 d-none">
            <h6 class="mb-2">Driver Offers</h6>
            <div id="offersForSenderList"></div>
        </div>

        <div id="trackingMapContainer" class="mt-4 d-none">
            <h6 class="mb-2">Live Tracking</h6>
            <div id="trackingMap" style="height: 280px; border-radius: 12px;"></div>
        </div>

        <div id="ratingSection" class="mt-4 d-none">
            <h6 class="mb-2">Rate this delivery</h6>
            <form id="ratingForm">
                <div class="mb-2">
                    <select class="form-select" id="ratingStars" style="max-width: 160px;">
                        <option value="5">5 — Excellent</option>
                        <option value="4">4 — Good</option>
                        <option value="3">3 — Okay</option>
                        <option value="2">2 — Poor</option>
                        <option value="1">1 — Very poor</option>
                    </select>
                </div>
                <div class="mb-2">
                    <textarea class="form-control" id="ratingComment" rows="2" placeholder="Optional comment"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Submit rating</button>
            </form>
        </div>
    </main>

    <div class="modal fade" id="driverInfoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Driver Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="driverModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/services/api.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/shipmentDetail.js"></script>
</body>
</html>
