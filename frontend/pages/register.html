<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CargoMove</title>
    
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    
    <header class="navbar">
        <a href="../index.html" class="logo">CargoMove CM</a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <main class="auth-container">

        <div class="auth-card register-card">

            <h1>Create an Account</h1>

            <p class="auth-subtitle">
                Join CargoMove and move your cargo with ease
            </p>


            <form id="registerForm">

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">First Name</label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="First name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="lastName">Last Name</label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Last name"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">
                    <label for="registerEmail">Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="role">
                        I want to register as
                    </label>

                    <select id="role" name="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="customer">
                            Customer
                        </option>

                        <option value="driver">
                            Driver
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I agree to the CargoMove terms and conditions.

                </label>


                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>


            <p class="switch-page">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer>
        <p>&copy; 2026 CargoMove CM. All rights reserved.</p>
    </footer>


    <script src="../js/main.js"></script>

</body>
</html>
